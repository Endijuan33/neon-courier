<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b19">
  <title>NEON COURIER · Midnight delivery service</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070b19; }
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
    #game { position: relative; width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); }
    #actions { position: absolute; inset: 0; pointer-events: none; }
    #actions button { position: absolute; border: 0; background: transparent; color: transparent; cursor: pointer; pointer-events: auto; }
    #actions button:hover { box-shadow: inset 0 0 0 2px #5cf3ed44; border-radius: 10px; }
    #actions button:focus-visible { outline: 3px solid #f9de70; outline-offset: 4px; border-radius: 10px; }
    #status { position: absolute; }
  </style>
</head>
<body>
  <main id="game" aria-label="NEON COURIER arcade game">
    <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Use WASD or arrow keys to fly, Space or Shift to dash, P to pause, R to restart, and M to mute."></canvas>
    <div id="actions" aria-label="Game menu"></div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript>Enable JavaScript to play NEON COURIER.</noscript>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
